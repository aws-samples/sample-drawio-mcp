name: Release MCP Server

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build jsapi
        working-directory: jsapi
        run: |
          npm ci
          npm run build

      - name: Pack MCP server
        working-directory: mcp
        run: |
          rm -rf vendor/drawio-jsapi/dist
          mkdir -p vendor/drawio-jsapi/dist
          cp -r ../jsapi/dist/* vendor/drawio-jsapi/dist/
          cp ../jsapi/package.json vendor/drawio-jsapi/package.json
          npm ci
          rm -rf node_modules/drawio-jsapi
          mkdir -p node_modules
          cp -r vendor/drawio-jsapi node_modules/drawio-jsapi
          npm pack
          cp drawio-mcp-server-*.tgz drawio-mcp-server-latest.tgz

      - name: Upload tarball artifact (for testing)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-tarball
          path: mcp/drawio-mcp-server-*.tgz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mcp/drawio-mcp-server-*.tgz
          generate_release_notes: true
